# The default vizreel theme: dark panel, light text, amber highlight.
colors:
  background: "#0E1116"
  surface: "#161B22"
  text: "#F0F3F6"
  muted: "#9BA4AE"
  grid: "#30363D"
  accent: "#58A6FF"
  positive: "#3FB950"
  negative: "#F85149"
  highlight: "#F2B53A"
  series: ["#58A6FF", "#3DD6C6", "#DB61A2"]
  dim_opacity: 0.55

fonts:
  heading: { family: Inter, weight: semibold }
  body: { family: Inter, weight: regular }
  numbers: { family: Inter, weight: bold }

sizes:
  title: 60
  subtitle: 38
  big_number: 180
  label: 38
  value: 36
  caption: 26
  panel_radius: 32
  panel_padding: 64
  line: 6
  grid_line: 2
  dot: 16

motion:
  easing: ease_out_cubic
  title_fade: 0.5
  structure: 0.6
  stagger: 0.08
  highlight: 0.6
  hold: 1.5

background_panel: true
