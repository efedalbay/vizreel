# Every chart type that can read its data from a CSV file, reading it from data/.
# See "Data from files" in docs/SPEC.md.
version: 1

charts:
  - id: regions
    type: bar
    title: Northwind revenue by region
    data: data/regions.csv
    number: { prefix: "$", compact: true }
    highlight: { label: East }
    source: "Source: example data"

  - id: revenue
    type: line
    title: Northwind revenue by product
    subtitle: In billions of dollars
    data: data/revenue.csv
    number: { prefix: "$", suffix: "B" }
    highlight: { x: "2021", label: "Cloud passes devices" }

  - id: profit
    type: waterfall
    title: How Northwind's revenue became profit
    data: data/profit.csv
    number: { prefix: "$", compact: true }

  - id: markets
    type: table
    title: Northwind's largest markets
    data: { file: data/markets.csv, columns: [Market, Revenue, Growth] }
    columns:
      - { name: Market }
      - { name: Revenue, number: { prefix: "$", compact: true } }
      - { name: Growth, number: { suffix: "%" } }
    highlight: { row: Japan }

  - id: market
    type: share
    title: Northwind's share of the market
    data: data/market.csv

  - id: revenue-mix
    type: stacked
    title: Northwind revenue by product
    data: data/mix.csv
    number: { prefix: "$", suffix: "B" }
    highlight: { series: Cloud }

  - id: region-growth
    type: grouped
    title: Northwind revenue by region
    subtitle: In millions of dollars
    data: data/regions-by-year.csv
    number: { prefix: "$", suffix: "M" }
    highlight: { series: "2023" }

  - id: users
    type: area
    title: Northwind users by platform
    data: data/users.csv
    stack: true
    number: { suffix: "M" }

  - id: market-race
    type: bar-race
    title: Northwind rises through the market
    subtitle: Revenue in millions of dollars, 2001 to 2024
    data: data/market-race.csv
    number: { prefix: "$", suffix: "M" }
    highlight: { series: Northwind }
    images:
      Northwind: logos/northwind.svg
      Contoso: logos/contoso.svg
      Fabrikam: logos/fabrikam.svg
      Tailspin: logos/tailspin.svg
      Alpine: logos/alpine.svg
    captions:
      - { period: "2008", text: "Northwind opens its first store abroad" }
      - { period: "2015", text: "A new product line takes off" }
      - { period: "2021", text: "Northwind takes the lead" }

  - id: catching-up
    type: line-race
    title: Northwind catches up
    data: { file: data/market-race.csv, columns: [Year, Northwind, Contoso, Fabrikam, Alpine] }
    number: { prefix: "$", suffix: "M" }
    highlight: { series: Northwind }
    captions:
      - { period: "2010", text: "Growth picks up" }
      - { period: "2020", text: "Northwind passes Alpine" }

  - id: history
    type: timeline
    title: How Northwind grew
    data: data/history.csv
    sequence: ["2016", "2018", "2020"]

  - id: headcount
    type: compare
    title: Northwind's employees
    data: data/headcount.csv
