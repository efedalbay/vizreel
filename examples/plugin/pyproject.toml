[project]
name = "vizreel-dots"
version = "0.1.0"
description = "A dots chart type for vizreel: how many of a group, as a grid of dots that fill in."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["vizreel>=0.7"]

# This line is what makes it a vizreel plugin: the chart type's name, then where its class is.
[project.entry-points."vizreel.chart_types"]
dots = "vizreel_dots:DotsChartType"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vizreel_dots"]
