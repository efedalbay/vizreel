[project]
name = "vizreel-progress"
version = "0.1.0"
description = "A progress chart type for vizreel: how far a value has come toward a goal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["vizreel>=0.7"]

# This line is what makes it a vizreel plugin: the chart type's name, then where its class is.
[project.entry-points."vizreel.chart_types"]
progress = "vizreel_progress:ProgressChartType"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vizreel_progress"]
