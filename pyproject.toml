[project]
name = "vizreel"
version = "0.13.0"
description = "Animated charts for video, from a YAML file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Efe Dalbay" }]
requires-python = ">=3.11"
keywords = ["charts", "animation", "video", "manim", "data visualization", "yaml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "manim>=0.21,<0.22",
    "typer",
    "pydantic>=2",
    "pyyaml",
    "rich",
    "av>=18.1.0",
]

[project.urls]
Homepage = "https://github.com/efedalbay/vizreel"
Documentation = "https://github.com/efedalbay/vizreel/blob/main/docs/SPEC.md"
Issues = "https://github.com/efedalbay/vizreel/issues"
Changelog = "https://github.com/efedalbay/vizreel/blob/main/CHANGELOG.md"

[project.scripts]
vizreel = "vizreel.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vizreel"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "render: slow tests that render video with Manim",
]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["vizreel.spec.*", "vizreel.themes.*", "vizreel.format.*"]
strict = true

[[tool.mypy.overrides]]
module = ["manim.*", "manimpango.*"]
ignore_missing_imports = true
