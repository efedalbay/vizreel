name: Bug report
description: Something does not work as the documentation says.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: A spec that shows it
      description: The smallest spec you can make that shows the problem, and any CSV or theme file it uses.
      render: yaml
  - type: textarea
    id: output
    attributes:
      label: The command and its output
      description: >-
        For example `vizreel render charts.yaml --quality preview`, and what it printed. For an
        unexpected error, run it again as `vizreel --debug render ...` and include the traceback.
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: vizreel, Python and operating system
      placeholder: vizreel 0.13.0, Python 3.12.7, Windows 11
    validations:
      required: true
